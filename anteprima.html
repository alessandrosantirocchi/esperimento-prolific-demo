<!doctype html><html lang="it"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>InstaLab — Anteprima</title><style>html,body{margin:0;padding:0}
/* InstaLab — Instagram-inspired research feed, not affiliated with Instagram. */
body { --ink:#111; --muted:#737373; --edge:#dbdbdb; --blue:#0095f6; --paper:#fff; --soft:#fafafa; color:var(--ink); color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
*,*::before,*::after {box-sizing:border-box;}
button,input {font:inherit;}
button {border:0;background:transparent;color:inherit;cursor:pointer;}
button:focus-visible, input:focus-visible {outline:2px solid var(--blue);outline-offset:2px;}
svg {display:block;flex:none;}
#instalab-root {min-height:100vh;background:#fff;color:#111;line-height:1.35;}
.instalab-shell {min-height:100vh;}
.desktop-sidebar {height:100dvh;width:245px;position:fixed;z-index:10;left:0;top:0;border-right:1px solid var(--edge);background:#fff;padding:28px 12px 16px;display:flex;flex-direction:column;}
.wordmark {display:inline-flex;align-items:baseline;width:max-content;font-family:"Brush Script MT","Segoe Script","Comic Sans MS",cursive;font-size:33px;font-weight:700;letter-spacing:-1.5px;padding:0 12px;margin:4px 0 30px;color:#161616;}
.brand-dot {color:#f24d81;}
.sidebar-nav {display:flex;flex-direction:column;gap:6px;}
.sidebar-footer{margin-top:auto;}
.nav-entry {display:flex;gap:16px;align-items:center;text-align:left;width:100%;border-radius:8px;min-height:48px;padding:11px 12px;font-size:16px;transition:background .15s;}
.nav-entry span{white-space:nowrap;}
.nav-entry.selected {font-weight:700;}
.nav-entry:hover {background:#f3f3f3;}
.nav-entry.selected svg {stroke-width:2.5;}
.page-content {margin-left:245px;min-height:100vh;}
.feed-area{margin:0 auto;max-width:1090px;padding:26px 26px 40px;display:flex;gap:64px;align-items:start;justify-content:center;}
.timeline{width:470px;max-width:100%;flex:0 1 470px;min-width:0;}
.stories{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:0 1px 23px;scrollbar-width:none;}
.stories::-webkit-scrollbar{display:none;}
.story{width:69px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;}
.story-ring{width:66px;height:66px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 225deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);padding:3px;}
.story-ring.own{background:#e5e5e5;}
.story-inside{display:block;width:100%;height:100%;background:#fff;border-radius:50%;padding:2px;overflow:hidden;}
.story-inside .avatar-img,.story-inside .avatar-fallback{width:100%;height:100%;border-radius:50%;}
.story-plus {position:absolute;bottom:0;right:0;background:#0095f6;border:2px solid white;border-radius:50%;font-size:17px;line-height:16px;color:#fff;width:20px;height:20px;}
.story-name{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-list{display:flex;flex-direction:column;gap:14px;}
.post{border-bottom:1px solid var(--edge);padding:0 0 15px;margin:0 0 4px;max-width:100%;background:#fff;}
.post-header{height:56px;display:flex;align-items:center;gap:10px;padding:0 2px 9px;}
.avatar-button{padding:0;border-radius:50%;display:flex;}
.avatar-img,.avatar-fallback{display:block;width:36px;height:36px;object-fit:cover;border-radius:50%;background:#f3f3f3;}
.avatar-fallback{display:flex;align-items:center;justify-content:center;}
.post-header .avatar-img{width:35px;height:35px;box-shadow:0 0 0 1px #ddd;}
.post-header-main{flex:1;min-width:0;}
.post-name-row{display:flex;align-items:center;gap:5px;}
.username-link{font-size:14px;font-weight:650;padding:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.username-link:hover,.caption-line strong:hover{color:#777;}
.verified{background:#3897f0;color:#fff;border-radius:50%;width:14px;height:14px;line-height:14px;font-size:11px;text-align:center;font-weight:700;}
.time-dot,.time-small{font-size:14px;color:var(--muted);}
.post-location{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-button{width:34px;height:36px;padding:3px;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.icon-button:hover{color:#6e6e6e;transform:scale(1.06);}
.icon-button.liked{color:#ff3040;}
.icon-button.saved{color:#111;}
.options{margin-left:auto;}
.photo-wrap{height:auto;aspect-ratio:1/1;width:100%;position:relative;background:#f1f1f1;overflow:hidden;border:1px solid #efefef;border-radius:3px;user-select:none;}
.post-photo{width:100%;height:100%;display:block;object-fit:cover;}
.photo-placeholder{height:100%;width:100%;display:grid;place-items:center;color:#777;background:linear-gradient(135deg,#f2d9d2,#e5deef,#cddde7);font-size:15px;text-align:center;padding:20px;}
.burst-heart{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);opacity:0;color:#fff;filter:drop-shadow(0 4px 16px #0005);pointer-events:none;}
.burst-heart.animate{animation:heartburst .65s ease-in-out;}
@keyframes heartburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}55%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.post-actions{display:flex;align-items:center;justify-content:space-between;margin:7px -3px 8px;}
.post-actions-left{display:flex;align-items:center;gap:9px;}
.post-body{font-size:14px;}
.likes{margin-bottom:7px;font-size:14px;}
.caption-line{line-height:1.5;margin-bottom:6px;overflow-wrap:anywhere;}
.caption-line strong{margin-right:4px;}
.muted-link{padding:0;color:#777;display:block;text-align:left;font-size:14px;margin:5px 0;}
.comments-preview{display:flex;flex-direction:column;gap:4px;}
.comment-line{font-size:14px;line-height:1.35;overflow-wrap:anywhere;}
.comment-line strong{margin-right:4px;}
.comment-form{display:flex;align-items:center;gap:12px;margin-top:9px;}
.comment-form input{flex:1;min-width:0;border:none;background:transparent;padding:5px 0 5px;font-size:14px;outline:none;color:#111;}
.comment-form input::placeholder{color:#777;}
.submit-comment{font-size:13px;font-weight:700;color:var(--blue);padding:0;}
.submit-comment:hover{color:#00376b;}
.suggestions{width:294px;flex:0 0 294px;padding-top:8px;font-size:13px;}
.current-user,.suggest-person{display:flex;gap:12px;align-items:center;margin-bottom:18px;}
.current-user .you-avatar{width:46px;height:46px;border-radius:50%;background:#ebedf1;display:grid;place-items:center;color:#717782;}
.current-user>div,.suggest-person>div{flex:1;display:flex;flex-direction:column;min-width:0;}
.current-user strong,.suggest-person strong{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.current-user small,.suggest-person small{font-size:12px;color:#777;margin-top:3px;}
.switch-label,.follow-link{color:var(--blue);font-size:12px;font-weight:700;}
.follow-link.following{color:#777;}
.suggest-title{display:flex;align-items:center;justify-content:space-between;margin:21px 0 19px;color:#777;font-size:14px;}
.suggest-title small{color:#111;font-size:12px;}
.suggest-person{margin-bottom:14px;padding-left:3px;}
.suggest-person .avatar-img{width:34px;height:34px;}
.suggest-footer{color:#c0c0c0;font-size:11px;line-height:1.7;margin:25px 0 0;}
.suggest-footer+.suggest-footer{margin-top:10px;}
.research-note{display:flex;gap:7px;color:#8b8b8b;font-size:11px;margin-top:25px;align-items:flex-start;background:#fafafa;padding:11px;border-radius:8px;}
.end-feed{text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;padding:35px 0 10px;font-size:14px;}
.end-check{border:2px solid #111;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;margin-bottom:5px;}
.end-feed span{color:#777;font-size:13px;}
.mobile-top,.mobile-bottom{display:none;}
.other-page{max-width:900px;padding:30px 24px;margin:0 auto;}
.other-header{border-bottom:1px solid #ededed;padding-bottom:18px;margin-bottom:24px;}
.other-header h2{font-size:24px;margin:0 0 5px;font-weight:700;}
.other-header p{font-size:14px;color:#777;margin:0;}
.explore-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;}
.explore-tile{position:relative;display:block;width:100%;aspect-ratio:1/1;overflow:hidden;padding:0;}
.explore-tile img{width:100%;height:100%;object-fit:cover;transition:transform .2s;}
.explore-tile:hover img{transform:scale(1.03);}
.explore-tile>span{position:absolute;inset:0;background:#0007;color:white;display:flex;gap:6px;align-items:center;justify-content:center;opacity:0;font-weight:bold;}
.explore-tile:hover>span{opacity:1;}
.search-box{display:flex;align-items:center;gap:10px;background:#eee;padding:10px 14px;border-radius:9px;margin-bottom:20px;}
.search-box input{border:0;outline:none;background:transparent;width:100%;font-size:15px;}
.search-result{display:flex;width:100%;padding:10px 0;text-align:left;align-items:center;gap:12px;border-bottom:1px solid #f2f2f2;}
.search-result .avatar-img{width:43px;height:43px;}
.search-result span{display:flex;flex-direction:column;flex:1;gap:2px;}
.search-result small{color:#888;}
.empty-panel{text-align:center;margin:50px auto 0;padding:45px 20px;display:flex;align-items:center;flex-direction:column;gap:10px;}
.empty-panel h3{margin:3px 0;font-size:24px;}
.empty-panel p{max-width:360px;font-size:14px;color:#777;}
.empty-panel button{background:#0095f6;color:#fff;padding:10px 22px;border-radius:8px;font-weight:bold;margin-top:8px;}
.empty-state{grid-column:1/-1;text-align:center;color:#777;padding:60px 10px;font-size:14px;}
.profile-header{display:flex;gap:65px;align-items:center;padding:25px 30px 45px;border-bottom:1px solid #ddd;}
.large-avatar{height:140px;width:140px;border-radius:50%;background:#eee;display:grid;place-items:center;}
.profile-username{font-size:21px;display:flex;gap:12px;align-items:center;}
.demo-tag{font-size:11px;color:#777;border-radius:5px;padding:5px 8px;background:#eee;}
.profile-stats{display:flex;gap:35px;margin:20px 0;}
.profile-tabs{display:flex;justify-content:center;gap:40px;}
.profile-tabs button{display:flex;align-items:center;gap:5px;padding:15px 0;text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:1px;}
.profile-tabs button.active{border-top:1px solid #111;}
.overlay{position:fixed;inset:0;z-index:40;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;}
.simple-modal{width:400px;max-width:100%;background:#fff;border-radius:12px;box-shadow:0 10px 60px #0004;text-align:center;overflow:hidden;}
.simple-modal h3{padding:22px 15px 10px;font-size:16px;margin:0;}
.simple-modal p{padding:0 22px 15px;color:#777;font-size:14px;}
.modal-option{width:100%;padding:15px;border-top:1px solid #eee;text-align:center;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:600;}
.simple-modal .cancel{padding:15px;width:100%;border-top:1px solid #eee;font-size:14px;}
.post-modal{max-width:520px;max-height:90vh;overflow-y:auto;padding:15px;background:#fff;border-radius:10px;position:relative;}
.post-modal .post{border:0;margin:0;}
.modal-close{position:absolute;right:10px;top:8px;z-index:2;color:#111;}
.post-modal .post-header{padding-right:28px;}
.story-overlay{background:#1b1b1b;}
.overlay-close{position:absolute;right:24px;top:23px;color:white;z-index:2;}
.story-view{width:390px;height:min(85vh,700px);border-radius:7px;background:#262626;position:relative;overflow:hidden;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 65px #0008;}
.story-view>img{width:100%;height:100%;object-fit:cover;}
.story-view-header{position:absolute;top:15px;left:15px;right:15px;z-index:1;display:flex;align-items:center;gap:9px;text-shadow:0 1px 5px #000;}
.story-view-header span{opacity:.8;font-size:12px;}
.story-view-header .avatar-img{width:34px;height:34px;}
.story-progress{position:absolute;z-index:2;top:5px;left:10px;right:10px;height:2px;border-radius:3px;background:#ffffff55;}
.story-progress span{height:2px;width:60%;display:block;background:white;}
.story-caption{position:absolute;bottom:60px;left:0;right:0;text-align:center;text-shadow:0 2px 9px #000;font-weight:600;}
.story-next{position:absolute;right:8px;top:50%;background:#ffffffcc;color:#111;border-radius:50%;padding:3px;}
@media (max-width:1270px){.feed-area{gap:35px;}.desktop-sidebar{width:74px;padding:25px 12px;}.desktop-sidebar .wordmark{font-size:0;padding:0 10px;margin:12px 0 28px;}.desktop-sidebar .wordmark::before{content:'◎';font-size:30px;font-family:Arial;}.desktop-sidebar .brand-dot{display:none;}.sidebar-nav .nav-entry span,.sidebar-footer .nav-entry span{display:none;}.sidebar-nav .nav-entry,.sidebar-footer .nav-entry{justify-content:center;}.page-content{margin-left:74px;}}
@media (max-width:1090px){.suggestions{display:none;}.feed-area{gap:0;justify-content:center;}.timeline{flex:0 1 470px;}}
@media (max-width:715px){.desktop-sidebar{display:none;}.page-content{margin-left:0;padding-top:55px;padding-bottom:55px;}.feed-area{padding:14px 0 0;max-width:100%;}.timeline{width:100%;flex:1;}.mobile-top{display:flex;position:fixed;top:0;left:0;right:0;height:55px;z-index:15;background:white;border-bottom:1px solid #efefef;justify-content:space-between;align-items:center;padding:0 14px;}.mobile-top .mobile-brand{font-size:29px;padding:0;margin:0;}.mobile-top>div{display:flex;gap:13px;}.mobile-top button,.mobile-bottom button{padding:4px;}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:54px;z-index:15;background:white;border-top:1px solid #eee;justify-content:space-around;align-items:center;}.stories{padding:3px 10px 13px;margin-bottom:1px;border-bottom:1px solid #f3f3f3;}.post-list{gap:9px;}.post{border-bottom:1px solid #eaeaea;}.post-header{padding:6px 12px 7px;height:57px;}.photo-wrap{border:0;border-radius:0;}.post-actions,.post-body{margin-left:12px;margin-right:12px;}.post-body{padding-bottom:4px;}.end-feed{padding-bottom:25px;}.other-page{padding:18px 10px;}.profile-header{gap:16px;padding:15px 10px 25px;}.large-avatar{width:78px;height:78px;flex:none;}.profile-stats{gap:14px;font-size:12px;}.profile-username{font-size:16px;flex-wrap:wrap;}.story-view{height:85vh;width:100%;max-width:390px;}}
/* A centred feed without desktop side panels or mobile navigation bars. */
.page-content {margin-left:0;padding-top:0;padding-bottom:0;}
.feed-area {max-width:550px;gap:0;justify-content:center;}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important;}}
</style></head><body><div id="instalab-root"></div><script>
// InstaLab — social feed simulator. Edit posts.json to replace stimuli.
// No real Instagram API, accounts, or external communication.
function initFeed(component) {
  const { parentElement, data, setStateValue } = component;
  const root = parentElement.querySelector('#instalab-root');
  if (!root) return;
  const posts = Array.isArray(data?.posts) ? data.posts : [];
  const stories = Array.isArray(data?.stories) ? data.stories : [];
  const participantId = data?.participant_id || 'DEMO_SESSION';
  const escape = (v) => String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  const shorten = (n) => new Intl.NumberFormat('it-IT').format(n);
  const ico = (name, filled=false, size=25) => {
    const shapes = {
      home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',
      compass: '<circle cx="12" cy="12" r="9"/><path d="m15.7 8.3-2.4 5-5 2.4 2.4-5z"/>',
      reels: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 5l4 5M16 5l4 5M10 13l5 3-5 3z"/>',
      message: '<path d="M21 3 3 10l7.5 2.4L13 20l8-17z"/><path d="m10.5 12.4 10.5-9.4"/>',
      heart: '<path d="M20.8 4.6a5.4 5.4 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.7z"/>',
      plus: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10M7 12h10"/>',
      menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
      comment: '<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9.4 9.4 0 0 1-4-.9L3 21l1.9-5.5A8.5 8.5 0 1 1 21 11.5z"/>',
      bookmark: '<path d="M5 3.5h14v17L12 16l-7 4.5z"/>',
      more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      chevron: '<path d="m9 18 6-6-6-6"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 7 2 8 0"/><path d="M8 9h.01M16 9h.01"/>',
      grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      volume: '<path d="M5 10H2v4h3l5 4V6zM14 9a4 4 0 0 1 0 6"/>',
      profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/>',
      arrow: '<path d="M12 19V5m-7 7 7-7 7 7"/>',
    };
    const paint = filled ? 'currentColor' : 'none';
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${paint}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name] || ''}</svg>`;
  };
  const timeLabel = (m) => m < 60 ? `${m} min` : m < 1440 ? `${Math.floor(m/60)} h` : `${Math.floor(m/1440)} g`;
  const history = Array.isArray(data?.history) ? data.history : [];
  let s = root.__instalab_state;
  if (!s || s.participantId !== participantId) {
    s = { participantId, tab:'home', overlay:null, overlayPost:null, storyIndex:0, query:'',
          liked:new Set(), disliked:new Set(), saved:new Set(), followed:new Set(), comments:{}, expanded:new Set(),
          events:history.slice(), started:Date.now(), seen:new Set() };
    for (const e of history) {
      if (e.event_type === 'like') s.liked.add(e.post_id);
      if (e.event_type === 'unlike') s.liked.delete(e.post_id);
      if (e.event_type === 'dislike') s.disliked.add(e.post_id);
      if (e.event_type === 'remove_dislike') s.disliked.delete(e.post_id);
      if (e.event_type === 'save') s.saved.add(e.post_id);
      if (e.event_type === 'unsave') s.saved.delete(e.post_id);
      if (e.event_type === 'follow') s.followed.add(e.details?.username);
      if (e.event_type === 'unfollow') s.followed.delete(e.details?.username);
      if (e.event_type === 'comment_submit') {
        (s.comments[e.post_id] ||= []).push({ username:'you', text:e.details?.text || '' });
      }
      if (e.event_id) s.seen.add(e.event_id);
    }
    root.__instalab_state = s;
  }
  s.disliked ||= new Set();

  let observer;
  const signal = (type, postId=null, details={}) => {
    const event = {
      event_id:`${Date.now()}-${Math.random().toString(36).slice(2,11)}`,
      event_type:type, post_id:postId, client_ts:new Date().toISOString(),
      elapsed_ms:Date.now()-s.started, details
    };
    s.events.push(event);
    // Keep all events in the browser for the demo session; Python deduplicates IDs.
    setStateValue('events', s.events);
  };
  const postBy = (id) => posts.find(p => p.id === id);
  const profileAvatar = (image, extra='') => image
    ? `<img class="avatar-img ${extra}" alt="" src="${escape(image)}" />`
    : `<span class="avatar-fallback ${extra}">${ico('profile',false,20)}</span>`;
  const navItem = (tab, iconName, label, hideOnCompact=false) =>
    `<button class="nav-entry ${s.tab===tab?'selected':''} ${hideOnCompact?'compact-hide':''}" data-action="nav" data-tab="${tab}" aria-label="${escape(label)}">${ico(iconName, s.tab===tab)}<span>${escape(label)}</span></button>`;

  const storyList = () => `<div class="stories" aria-label="Storie">
    ${stories.map((a,i)=>`<button class="story" data-action="story" data-index="${i}" title="Apri storia di ${escape(a.username)}">
      <span class="story-ring ${a.own?'own':''}"><span class="story-inside">${profileAvatar(a.image_url)}</span>${a.own?'<b class="story-plus">+</b>':''}</span>
      <span class="story-name">${escape(a.username)}</span>
    </button>`).join('')}
   </div>`;
  const eachComment = c => `<div class="comment-line"><strong>${escape(c.username)}</strong> ${escape(c.text)}</div>`;
  const post = (p) => {
    const isLiked = s.liked.has(p.id), isSaved = s.saved.has(p.id);
    const list = [...(p.comments || []), ...(s.comments[p.id] || [])];
    const shown = s.expanded.has(p.id) ? list : list.slice(-2);
    // Display one source-sheet tile without modifying the original stimulus.
    const region = p.image_region;
    const imageStyle = region ? `position:absolute;max-width:none;width:${region.source_width/region.width*100}%;height:auto;left:${-region.x/region.width*100}%;top:${-region.y/region.height*100}%;` : `object-position:${escape(p.image_position || 'center')};`;
    return `<article class="post" data-post="${escape(p.id)}">
       <header class="post-header">
         <button class="avatar-button" data-action="profile" data-user="${escape(p.username)}">${profileAvatar(p.avatar_url)}</button>
         <div class="post-header-main"><div class="post-name-row"><button class="username-link" data-action="profile" data-user="${escape(p.username)}">${escape(p.username)}</button>${p.verified?'<span class="verified" aria-label="Account verificato">✓</span>':''}<span class="time-dot">·</span><span class="time-small">${timeLabel(Number(p.minutes_ago)||42)}</span></div><div class="post-location">${escape(p.location || '')}</div></div>
         <button class="icon-button options" data-action="post_more" data-post="${escape(p.id)}" aria-label="Opzioni">${ico('more')}</button>
       </header>
       <div class="photo-wrap" data-doublepost="${escape(p.id)}">
          ${p.image_url?`<img class="post-photo" style="${imageStyle}" loading="lazy" src="${escape(p.image_url)}" alt="Foto del post di ${escape(p.username)}" />`:'<div class="photo-placeholder">Carica uno stimolo in posts.json</div>'}
          <div class="burst-heart">${ico('heart',true,105)}</div>
       </div>
       <div class="post-actions">
         <div class="post-actions-left">
           <button class="icon-button ${isLiked?'liked':''}" data-action="like" data-post="${escape(p.id)}" aria-label="${isLiked?'Rimuovi mi piace':'Mi piace'}" aria-pressed="${isLiked}">${ico('heart',isLiked,28)}</button>
           <button class="icon-button" data-action="dislike" data-post="${escape(p.id)}" aria-label="${s.disliked.has(p.id)?'Rimuovi dislike':'Dislike'}" aria-pressed="${s.disliked.has(p.id)}"><span aria-hidden="true">👎</span></button>
           <button class="icon-button" data-action="open_comments" data-post="${escape(p.id)}" aria-label="Commenta">${ico('comment',false,27)}</button>
           <button class="icon-button" data-action="share" data-post="${escape(p.id)}" aria-label="Condividi">${ico('message',false,27)}</button>
         </div>
         <button class="icon-button ${isSaved?'saved':''}" data-action="save" data-post="${escape(p.id)}" aria-label="${isSaved?'Rimuovi dai salvati':'Salva'}" aria-pressed="${isSaved}">${ico('bookmark',isSaved,27)}</button>
       </div>
       <div class="post-body">
         <div class="likes"><strong>${shorten((Number(p.initial_likes)||0)+(isLiked?1:0))} Mi piace</strong></div>
         <div class="caption-line"><strong>${escape(p.username)}</strong> ${escape(p.caption)}</div>
         ${list.length>2&&!s.expanded.has(p.id)?`<button class="muted-link" data-action="expand" data-post="${escape(p.id)}">Visualizza tutti i ${list.length} commenti</button>`:''}
         <div class="comments-preview">${shown.map(eachComment).join('')}</div>
         <form class="comment-form" data-comment-post="${escape(p.id)}"><input type="text" maxlength="280" placeholder="Aggiungi un commento..." aria-label="Scrivi un commento" autocomplete="off" /><button type="submit" class="submit-comment">Pubblica</button></form>
       </div>
     </article>`;
  };
  const home = () => `<div class="feed-area"><main class="timeline">${storyList()}<div class="post-list">${posts.map(post).join('')}</div><div class="end-feed"><div class="end-check">${ico('check')}</div><strong>Sei in pari</strong><span>Hai visto tutti i post di questa simulazione</span></div></main></div>`;
  const explore = (savedOnly=false) => `<section class="other-page"><header class="other-header"><h2>${savedOnly?'Elementi salvati':'Esplora'}</h2><p>${savedOnly?'I post che hai salvato':'Scopri i post della simulazione'}</p></header><div class="explore-grid">${posts.filter(p=>!savedOnly||s.saved.has(p.id)).map(p=>`<button class="explore-tile" data-action="open_post" data-post="${escape(p.id)}"><img src="${escape(p.image_url)}" alt=""/><span>${ico('heart',true,18)} ${shorten(Number(p.initial_likes)||0)}</span></button>`).join('')||'<div class="empty-state">Non hai ancora salvato nessun post.</div>'}</div></section>`;
  const search = () => `<section class="other-page"><header class="other-header"><h2>Cerca</h2><p>Cerca profili e post dimostrativi</p></header><div class="search-box">${ico('search')}<input autofocus class="search-input" type="search" placeholder="Cerca" value="${escape(s.query)}" aria-label="Cerca nel feed" /></div><div class="search-results">${posts.filter(p=>p.username.toLowerCase().includes(s.query.toLowerCase())||p.caption.toLowerCase().includes(s.query.toLowerCase())).map(p=>`<button class="search-result" data-action="open_post" data-post="${escape(p.id)}">${profileAvatar(p.avatar_url)}<span><strong>${escape(p.username)}</strong><small>${escape(p.location)}</small></span>${ico('chevron',false,18)}</button>`).join('')}</div></section>`;
  const profile = () => `<section class="other-page profile-page"><div class="profile-header"><span class="large-avatar">${ico('profile',false,48)}</span><div><div class="profile-username">you.research <span class="demo-tag">Account demo</span></div><div class="profile-stats"><span><strong>0</strong> post</span><span><strong>0</strong> follower</span><span><strong>${s.followed.size}</strong> seguiti</span></div><p>Profilo di simulazione per studi di ricerca.</p></div></div><div class="profile-tabs"><button class="active">${ico('grid',false,17)} Post</button><button data-action="nav" data-tab="saved">${ico('bookmark',false,17)} Elementi salvati</button></div><div class="empty-state">I post del feed sono esempi, non appartengono a questo profilo.</div></section>`;
  const misc = (tab) => `<section class="other-page"><header class="other-header"><h2>${({reels:'Reels',messages:'Messaggi',notifications:'Notifiche',create:'Crea'})[tab]||tab}</h2><p>Funzionalità dimostrativa</p></header><div class="empty-panel">${ico(tab==='messages'?'message':tab==='notifications'?'heart':tab==='reels'?'reels':'plus',false,45)}<h3>${tab==='messages'?'I tuoi messaggi':tab==='notifications'?'Le tue notifiche':'Area dimostrativa'}</h3><p>Questa sezione può essere personalizzata per un futuro scenario sperimentale.</p><button data-action="nav" data-tab="home">Torna al feed</button></div></section>`;
  const storyModal = () => {
    const item = stories[s.storyIndex];
    if (!item) return '';
    return `<div class="overlay story-overlay" data-close-overlay="true"><button class="overlay-close" data-action="close" aria-label="Chiudi">${ico('close',false,28)}</button><div class="story-view" role="dialog" aria-label="Storia"><div class="story-progress"><span></span></div><div class="story-view-header">${profileAvatar(item.image_url)}<strong>${escape(item.username)}</strong><span>ora</span></div>${item.image_url?`<img src="${escape(item.image_url)}" alt="Storia demo"/>`:''}<div class="story-caption">Un momento da condividere ✨</div><button class="story-next" data-action="next_story" aria-label="Storia successiva">${ico('chevron',false,30)}</button></div></div>`;
  };
  const modal = () => {
    if (!s.overlay) return '';
    if (s.overlay==='story') return storyModal();
    if (s.overlay==='post') {
      const p=postBy(s.overlayPost);if(!p) return '';
      return `<div class="overlay" data-close-overlay="true"><div class="post-modal" role="dialog" aria-label="Post"><button class="modal-close" data-action="close">${ico('close')}</button>${post(p)}</div></div>`;
    }
    const p=postBy(s.overlayPost);
    const title={share:'Condividi',post_more:'Opzioni del post',more:'Informazioni'}[s.overlay]||'Informazioni';
    return `<div class="overlay" data-close-overlay="true"><div class="simple-modal" role="dialog" aria-label="${title}"><h3>${title}</h3>
      ${s.overlay==='share' ? `<p>Condividi questo post all'interno della simulazione.</p><button class="modal-option" data-action="copy_link" data-post="${escape(s.overlayPost)}">${ico('message',false,20)} Copia link simulato</button><button class="modal-option" data-action="send_demo" data-post="${escape(s.overlayPost)}">${ico('arrow',false,20)} Invia (simulazione)</button>` :
        s.overlay==='post_more' ? `<button class="modal-option" data-action="save" data-post="${escape(s.overlayPost)}">${ico('bookmark',false,20)} Salva / Rimuovi dai salvati</button><button class="modal-option" data-action="copy_link" data-post="${escape(s.overlayPost)}">${ico('message',false,20)} Copia link simulato</button>` : '<p>InstaLab è un prototipo per esperimenti sulla percezione dei contenuti social. Nessun collegamento reale con Instagram.</p>'}
       <button class="cancel" data-action="close">Annulla</button></div></div>`;
  };

  const render = () => {
    const y=window.scrollY;
    const body = s.tab==='home'?home():s.tab==='explore'?explore():s.tab==='saved'?explore(true):s.tab==='search'?search():s.tab==='profile'?profile():misc(s.tab);
    root.innerHTML = `<div class="instalab-shell"><div class="page-content">${body}</div>${modal()}</div>`;
    window.requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));
  };

  const perform = (btn) => {
    const action=btn.dataset.action;
    const id=btn.dataset.post||null;
    if(action==='nav') { s.tab=btn.dataset.tab; s.overlay=null; signal('navigate',null,{page:s.tab}); window.scrollTo(0,0); }
    else if(action==='like') {
      if(s.disliked.delete(id))signal('remove_dislike',id);
      if(s.liked.has(id)){s.liked.delete(id);signal('unlike',id);} else{s.liked.add(id);signal('like',id,{method:'button'});}
    }
    else if(action==='dislike') {
      if(s.liked.delete(id))signal('unlike',id);
      if(s.disliked.has(id)){s.disliked.delete(id);signal('remove_dislike',id);}else{s.disliked.add(id);signal('dislike',id);}
    }
    else if(action==='save') {
      if(s.saved.has(id)){s.saved.delete(id);signal('unsave',id);}else{s.saved.add(id);signal('save',id);}
      if(s.overlay==='post_more')s.overlay=null;
    }
    else if(action==='expand'){ s.expanded.add(id); signal('expand_comments',id); }
    else if(action==='open_comments') { const input=root.querySelector(`form[data-comment-post="${CSS.escape(id)}"] input`);if(input){input.focus();input.scrollIntoView({block:'center',behavior:'smooth'});}signal('open_comments',id);return; }
    else if(action==='follow') { const u=btn.dataset.user;if(s.followed.has(u)){s.followed.delete(u);signal('unfollow',null,{username:u});}else{s.followed.add(u);signal('follow',null,{username:u});} }
    else if(action==='profile') { signal('open_profile',null,{username:btn.dataset.user}); s.tab='profile';window.scrollTo(0,0); }
    else if(action==='story'){s.storyIndex=Number(btn.dataset.index)||0;s.overlay='story';signal('story_open',null,{username:stories[s.storyIndex]?.username});}
    else if(action==='next_story'){s.storyIndex=(s.storyIndex+1)%stories.length;signal('story_open',null,{username:stories[s.storyIndex]?.username});}
    else if(action==='share'||action==='post_more'||action==='more'){s.overlay=action;s.overlayPost=id;if(id)signal('open_'+action,id);}
    else if(action==='open_post'){s.overlay='post';s.overlayPost=id;signal('open_post',id);}
    else if(action==='copy_link'){const url=`https://example.invalid/demo-post/${encodeURIComponent(id)}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).catch(()=>{});signal('copy_link',id,{simulated:true});s.overlay=null;}
    else if(action==='send_demo'){signal('share_simulated',id);s.overlay=null;}
    else if(action==='close'){s.overlay=null;}
    else if(action==='more'){s.overlay='more';}
    render();
  };
  root.onclick = (e) => {
    const btn=e.target.closest('button[data-action]');
    if(btn&&root.contains(btn)){e.preventDefault();perform(btn);return;}
    if(e.target.matches('[data-close-overlay]')){s.overlay=null;render();}
  };
  root.onsubmit = (e) => {
    const form=e.target.closest('form[data-comment-post]'); if(!form)return;
    e.preventDefault();
    const id=form.dataset.commentPost, input=form.querySelector('input');
    const value=(input?.value||'').trim(); if(!value)return;
    (s.comments[id] ||= []).push({username:'you.research',text:value});
    signal('comment_submit',id,{text:value,length:value.length});
    render();
  };
  root.oninput = (e) => {
    if(e.target.matches('.search-input')) {
      const pos=e.target.selectionStart;
      s.query=e.target.value;
      const holder=root.querySelector('.search-results');
      if(holder)holder.innerHTML=posts.filter(p=>p.username.toLowerCase().includes(s.query.toLowerCase())||p.caption.toLowerCase().includes(s.query.toLowerCase())).map(p=>`<button class="search-result" data-action="open_post" data-post="${escape(p.id)}">${profileAvatar(p.avatar_url)}<span><strong>${escape(p.username)}</strong><small>${escape(p.location)}</small></span>${ico('chevron',false,18)}</button>`).join('');
    }
  };
  root.ondblclick = (e) => {
    const p=e.target.closest('[data-doublepost]');if(!p)return;
    const id=p.dataset.doublepost;
    if(s.disliked.delete(id))signal('remove_dislike',id);
    if(!s.liked.has(id)){s.liked.add(id);signal('like',id,{method:'double_click'});}
    const heart=p.querySelector('.burst-heart');if(heart){heart.classList.remove('animate');void heart.offsetWidth;heart.classList.add('animate');}
    // Update icon and count after the heart burst animation.
    window.setTimeout(()=>{if(root.isConnected)render();},300);
  };
  // Track first impressions for each post; exact dwell time needs experimental validation.
  if(typeof IntersectionObserver!=='undefined' && s.tab==='home' && !s.overlay){
    observer=new IntersectionObserver(entries=>{
      for(const entry of entries){
        const id=entry.target.getAttribute('data-post');
        if(entry.isIntersecting&&!s.seen.has(id)){
          s.seen.add(id);signal('post_impression',id,{threshold:0.6});
        }
      }
    },{threshold:0.6});
  }
  render();
  if(observer){root.querySelectorAll('article[data-post]').forEach(el=>observer.observe(el));}
  return () => { if(observer)observer.disconnect(); root.onclick=null;root.onsubmit=null;root.oninput=null;root.ondblclick=null; };
}
